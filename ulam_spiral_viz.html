<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prime Spirals</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
header {
  padding: 14px 16px;
  border-bottom: 1px solid #1e1e2e;
}
header h1 { font-size: 1.1rem; color: #a0c4ff; }
header p  { font-size: 0.7rem; color: #555; margin-top: 2px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 16px;
  background: #0d0d16;
  border-bottom: 1px solid #1e1e2e;
  align-items: center;
}
.ctrl { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; }
label { color: #aaa; white-space: nowrap; }
input[type=range] { width: 100px; accent-color: #a0c4ff; }
input[type=checkbox] { accent-color: #a0c4ff; width:16px; height:16px; cursor:pointer; }
.val { color: #a0c4ff; min-width: 38px; }
select {
  background: #1a1a2e; border: 1px solid #333; color: #e0e0e0;
  padding: 3px 6px; border-radius: 4px; font-family: inherit; font-size: 0.78rem;
}

.panels {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 20px 16px 32px;
}
.panel { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.panel-title { font-size: 0.85rem; color: #c8b8ff; letter-spacing: 0.08em; text-transform: uppercase; }
.panel-sub { font-size: 0.68rem; color: #555; text-align: center; max-width: 500px; line-height: 1.5; }

canvas { border: 1px solid #1e1e2e; border-radius: 4px; display: block; touch-action: none; }

.tooltip {
  position: fixed;
  background: rgba(10,10,20,0.93);
  border: 1px solid #333;
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 0.75rem;
  pointer-events: none;
  display: none;
  z-index: 100;
}
.prime-lbl { color: #a0c4ff; }
.comp-lbl  { color: #666; }
</style>
</head>
<body>

<header>
  <h1>Prime Spirals</h1>
  <p>Ulam (1963) · Sacks (1994) — tap a dot for details</p>
</header>

<div class="controls">
  <div class="ctrl">
    <label>N</label>
    <input type="range" id="rangeN" min="200" max="20000" step="200" value="5000">
    <span class="val" id="rangeNVal">5 000</span>
  </div>
  <div class="ctrl">
    <label>Color</label>
    <select id="colorScheme">
      <option value="blue">Ice blue</option>
      <option value="gold">Gold</option>
      <option value="green">Neon green</option>
      <option value="rainbow">Rainbow</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Composites</label>
    <input type="checkbox" id="showComposites" checked>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-title">Ulam Spiral</div>
    <canvas id="ulamCanvas"></canvas>
    <div class="panel-sub">Integers in a rectangular spiral. Prime diagonals trace quadratic polynomials 4n²+bn+c.</div>
  </div>
  <div class="panel">
    <div class="panel-title">Sacks Spiral</div>
    <canvas id="sacksCanvas"></canvas>
    <div class="panel-sub">Integer n at polar coords (√n, 2π√n). Perfect squares align right; primes form curves.</div>
  </div>
</div>

<div id="tooltip" class="tooltip"></div>

<script>
// ── Sieve ──────────────────────────────────────────────────────────────────
function sieve(limit) {
  const ip = new Uint8Array(limit + 1).fill(1);
  ip[0] = ip[1] = 0;
  for (let i = 2; i * i <= limit; i++)
    if (ip[i]) for (let j = i*i; j <= limit; j += i) ip[j] = 0;
  return ip;
}

// ── Canvas sizing: fill available width, square, HiDPI aware ──────────────
function makeCanvas(el) {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(window.innerWidth - 32, 520);
  el.style.width  = size + 'px';
  el.style.height = size + 'px';
  el.width  = Math.round(size * dpr);
  el.height = Math.round(size * dpr);
  return { size, dpr };
}

// ── Prime colour ───────────────────────────────────────────────────────────
function primeColor(n, maxN, scheme) {
  if (scheme === 'blue')    return '#a0c4ff';
  if (scheme === 'gold')    return '#ffd166';
  if (scheme === 'green')   return '#06ffa5';
  const h = Math.round((n / maxN) * 280);
  return `hsl(${h},90%,65%)`;
}

// ── Ulam grid coordinate ──────────────────────────────────────────────────
function ulamCoord(n) {
  if (n === 1) return { x: 0, y: 0 };
  const k    = Math.ceil((Math.sqrt(n) - 1) / 2);
  const side = 2 * k;
  const pos  = n - (2*k-1)*(2*k-1) - 1;
  let x = k-1, y = -(k-1), p = pos;
  if (p < 1)    { x += p+1; return {x,y}; }  x += 1;    p -= 1;
  if (p < side) { y += p+1; return {x,y}; }  y += side; p -= side;
  if (p < side) { x -= p+1; return {x,y}; }  x -= side; p -= side;
  if (p < side) { y -= p+1; return {x,y}; }  y -= side; p -= side;
  x += p+1; return {x,y};
}

// ── State ──────────────────────────────────────────────────────────────────
let maxN     = 5000;
let isPrime  = sieve(maxN);
let ulamMap  = new Map();  // "gx,gy" -> n
let sacksArr = [];         // [{n, px, py}] (CSS pixels)

function cfg() {
  return {
    colorScheme:    document.getElementById('colorScheme').value,
    showComposites: document.getElementById('showComposites').checked,
  };
}

// ── Render Ulam ────────────────────────────────────────────────────────────
function renderUlam() {
  const el  = document.getElementById('ulamCanvas');
  const { size, dpr } = makeCanvas(el);
  const ctx = el.getContext('2d');
  const C   = cfg();
  const W   = el.width, H = el.height;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, W, H);

  const gridR   = Math.ceil(Math.sqrt(maxN) / 2) + 1;
  const cell    = (size * dpr) / (2 * gridR + 1);
  const dotR    = Math.min(1.8 * dpr, cell * 0.45);
  const cx = W/2, cy = H/2;

  ulamMap = new Map();
  ctx.save();

  for (let n = 1; n <= maxN; n++) {
    const {x, y} = ulamCoord(n);
    ulamMap.set(`${x},${y}`, n);

    const prime = isPrime[n];
    if (!prime && !C.showComposites) continue;

    const px = cx + x * cell;
    const py = cy - y * cell;
    if (px < -dotR || px > W+dotR || py < -dotR || py > H+dotR) continue;

    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI*2);
    ctx.fillStyle = prime ? primeColor(n, maxN, C.colorScheme) : '#1c1c28';
    ctx.fill();
  }
  ctx.restore();

  // store for tap lookup
  el._cell = cell; el._cx = cx; el._cy = cy; el._dpr = dpr;
}

// ── Render Sacks ───────────────────────────────────────────────────────────
function renderSacks() {
  const el  = document.getElementById('sacksCanvas');
  const { size, dpr } = makeCanvas(el);
  const ctx = el.getContext('2d');
  const C   = cfg();
  const W   = el.width, H = el.height;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, W, H);

  const cx    = W/2, cy = H/2;
  const maxR  = Math.sqrt(maxN);
  const scale = (size * dpr / 2 - 6) / maxR;
  const dotR  = Math.min(2 * dpr, scale * 0.35);

  sacksArr = [];
  ctx.save();

  for (let n = 2; n <= maxN; n++) {
    const r     = Math.sqrt(n);
    const theta = 2 * Math.PI * r;
    const px    = cx + r * scale * Math.cos(theta);
    const py    = cy - r * scale * Math.sin(theta);
    const prime = isPrime[n];

    if (!prime && !C.showComposites) continue;

    // store in CSS pixels for tap lookup
    sacksArr.push({ n, px: px/dpr, py: py/dpr });

    if (px < -dotR || px > W+dotR || py < -dotR || py > H+dotR) continue;

    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI*2);
    ctx.fillStyle = prime ? primeColor(n, maxN, C.colorScheme) : '#1c1c28';
    ctx.fill();
  }
  ctx.restore();
}

function redraw() {
  renderUlam();
  renderSacks();
}

// ── Controls ───────────────────────────────────────────────────────────────
document.getElementById('rangeN').addEventListener('input', function() {
  maxN    = parseInt(this.value);
  isPrime = sieve(maxN);
  document.getElementById('rangeNVal').textContent = maxN.toLocaleString();
  redraw();
});

['colorScheme', 'showComposites'].forEach(id =>
  document.getElementById(id).addEventListener('change', redraw)
);

window.addEventListener('resize', redraw);

// ── Tooltip ────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function showTip(clientX, clientY, n) {
  if (!n || n < 1 || n > maxN) { tooltip.style.display = 'none'; return; }
  const p = isPrime[n];
  tooltip.innerHTML = `<span class="${p ? 'prime-lbl' : 'comp-lbl'}">${n.toLocaleString()}</span> — ${p ? '✓ prime' : 'composite'}`;
  tooltip.style.display = 'block';
  tooltip.style.left = (clientX + 14) + 'px';
  tooltip.style.top  = (clientY - 28) + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

// Ulam hover / tap
const ulamEl = document.getElementById('ulamCanvas');

function ulamHit(clientX, clientY) {
  const rect = ulamEl.getBoundingClientRect();
  const dpr  = ulamEl._dpr || 1;
  const cell = ulamEl._cell;
  if (!cell) return null;
  const mx = (clientX - rect.left) * dpr;
  const my = (clientY - rect.top)  * dpr;
  const gx = Math.round((mx - ulamEl._cx) / cell);
  const gy = Math.round((ulamEl._cy - my) / cell);
  return ulamMap.get(`${gx},${gy}`) || null;
}

ulamEl.addEventListener('mousemove', e => showTip(e.clientX, e.clientY, ulamHit(e.clientX, e.clientY)));
ulamEl.addEventListener('mouseleave', hideTip);
ulamEl.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  showTip(t.clientX, t.clientY, ulamHit(t.clientX, t.clientY));
}, { passive: false });
ulamEl.addEventListener('touchend', () => setTimeout(hideTip, 1800));

// Sacks hover / tap
const sacksEl = document.getElementById('sacksCanvas');

function sacksHit(clientX, clientY) {
  const rect = sacksEl.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  let best = null, bestD = 14;
  for (const pt of sacksArr) {
    const d = Math.hypot(pt.px - mx, pt.py - my);
    if (d < bestD) { bestD = d; best = pt.n; }
  }
  return best;
}

sacksEl.addEventListener('mousemove', e => showTip(e.clientX, e.clientY, sacksHit(e.clientX, e.clientY)));
sacksEl.addEventListener('mouseleave', hideTip);
sacksEl.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  showTip(t.clientX, t.clientY, sacksHit(t.clientX, t.clientY));
}, { passive: false });
sacksEl.addEventListener('touchend', () => setTimeout(hideTip, 1800));

// ── Boot ───────────────────────────────────────────────────────────────────
redraw();
</script>
</body>
</html>
